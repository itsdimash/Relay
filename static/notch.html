<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Relay</title>
<link rel="stylesheet" href="/notch.css">
<script type="module" src="/notch.js"></script>
</head>
<body>
<main class="panel" id="panel" data-actor="idle">
  <section class="room" aria-label="Your agents">
    <canvas id="room" width="180" height="100" role="img" aria-label="Animated room where your three agents pass work to each other"></canvas>
    <p id="roomLabel" class="room-label" role="status"></p>
  </section>
  <section class="info">
    <header class="info-head">
      <span id="status" class="status" role="status">Relay is idle</span>
      <span id="timer" class="timer"></span>
    </header>
    <h1 id="title" class="title">Nothing running</h1>
    <ol id="steps" class="steps" aria-label="Progress"></ol>
    <p id="stepText" class="step-text"></p>
    <p id="last" class="last"></p>
    <div id="approval" class="approval" hidden>
      <p id="planSummary" class="plan-summary"></p>
      <ul id="planChecks" class="plan-checks"></ul>
      <div class="approval-actions">
        <button type="button" class="btn quiet" id="open2">Open Relay</button>
        <button type="button" class="btn quiet" id="reject">Reject</button>
        <button type="button" class="btn primary" id="approve">Approve</button>
      </div>
      <p id="approvalError" class="error" role="alert"></p>
    </div>
    <footer class="foot">
      <button type="button" class="btn quiet" id="open">Open Relay</button>
    </footer>
  </section>
</main>
</body>
</html>
